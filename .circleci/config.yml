version: 2.1

executors:
  flutter-executor:
    docker:
      - image: circleci/flutter:latest
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD
    working_directory: ~/repo

jobs:
  build-android-qa:
    executor: flutter-executor
    steps:
      - checkout  # Pull the code from the repository
      - run:
          name: Install dependencies
          command: flutter pub get
      - run:
          name: Build QA APK
          command: flutter build apk --flavor qa -t lib/main_qa.dart --release
      - store_artifacts:
          path: build/app/outputs/flutter-apk/app-qa-release.apk  # Store the APK as an artifact
          destination: android_apk

  deploy-firebase:
    docker:
      - image: google/cloud-sdk:latest  # Use the Firebase CLI Docker image
    steps:
      - checkout  # Pull the code from the repository
      - run:
          name: Install Firebase CLI
          command: curl -sL https://firebase.tools | bash
      - run:
          name: Set up Firebase authentication
          command: |
            echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > $HOME/firebase-service-account.json
            firebase use --add  # Set the Firebase project to use
      - run:
          name: Deploy to Firebase App Distribution
          command: |
            firebase appdistribution:distribute build/app/outputs/flutter-apk/app-qa-release.apk \
              --app <your-firebase-app-id> \
              --groups "QA Testers"  # Replace with your Firebase Tester Group's name
      - run:
          name: Clean up Firebase service account file
          command: rm $HOME/firebase-service-account.json

workflows:
  version: 2
  build-and-deploy:
    jobs:
      - build-android-qa
      - deploy-firebase:
          requires:
            - build-android-qa
